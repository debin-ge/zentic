# Minimal Zentic daemon + web UI deployment.
#
# Open http://localhost:6767 after `docker compose up -d`.
# For any network-reachable deployment, change ZENTIC_PASSWORD first.
services:
  zentic:
    image: ghcr.io/getzentic/zentic:latest
    container_name: zentic
    restart: unless-stopped
    ports:
      - "6767:6767"
    environment:
      ZENTIC_PASSWORD: "change-me"
      # Add DNS names you use to reach this container. IPs and localhost are
      # already allowed by default.
      # ZENTIC_HOSTNAMES: "zentic.example.com,.lan"
    volumes:
      # Persistent daemon state and agent credentials/config.
      - ./zentic-home:/home/zentic
      # Code visible to Zentic and the agents it launches.
      - ./workspace:/workspace
