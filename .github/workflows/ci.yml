name: CI

on:
  # Manual only. Start it from the Actions tab for the ref to check.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CI does not use the CUDA execution provider, and the onnxruntime-node
  # postinstall download from NuGet is large enough to make npm ci flaky.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Install agent CLIs for provider tests
        run: node scripts/npm-retry.mjs install -g @anthropic-ai/claude-code opencode-ai

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build server stack
        run: npm run build:server

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: |
          npm run test --workspace=@getzentic/protocol
          npm run test --workspace=@getzentic/client
          npm run test:unit --workspace=@getzentic/server
          npm run test:unit --workspace=@getzentic/cli
