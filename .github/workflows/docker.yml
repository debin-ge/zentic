name: Docker

# Builds the image for linux/amd64 and linux/arm64 and publishes it to GHCR.
# A pushed v* tag publishes <version>, sha-<commit> and, for a stable version,
# latest. A manual run publishes the version it is given.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, matching package.json (e.g. 0.16.1)."
        required: true
      latest:
        description: "Also move the latest tag. Ignored for prereleases."
        type: boolean
        default: false

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/debin-ge/zentic

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve tags
        id: tags
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_LATEST: ${{ inputs.latest }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
            latest=true
          else
            version="${INPUT_VERSION#v}"
            latest="${INPUT_LATEST}"
          fi
          # A prerelease (any version with a "-") never moves latest.
          [[ "${version}" != *-* ]] || latest=false
          {
            echo "version=${version}"
            echo "tags<<EOF"
            echo "${IMAGE}:${version}"
            # The commit tag stays put when a version is published again, so a
            # deployment can pin it and roll back to it.
            echo "${IMAGE}:sha-${GITHUB_SHA::12}"
            [[ "${latest}" != "true" ]] || echo "${IMAGE}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/base/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            ZENTIC_VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          push: true
          provenance: false
          cache-from: type=gha,scope=zentic
          cache-to: type=gha,scope=zentic,mode=max
